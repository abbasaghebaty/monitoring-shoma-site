name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm to a peer-resolution version supported by the Node 22 runner
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm --prefix worker ci
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --audit-level=high
          npm --prefix worker audit --audit-level=high
      - name: Test Worker utilities and isolated SQLite integration
        run: npm --prefix worker test
      - name: Test against isolated Cloudflare D1 runtime
        run: npm run test:d1
      - name: Build
        env:
          VITE_APP_ENV: production
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

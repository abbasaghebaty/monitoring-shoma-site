name = "shoma-api"
main = "src/index.js"
compatibility_date = "2026-11-17"

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://abbasaghebaty.github.io"

[[d1_databases]]
binding = "DB"
database_name = "shop-manager"
database_id = "4e406079-a02f-4412-9167-57ca03b29f85"

[[kv_namespaces]]
binding = "SITE_AUTH_KV"
id = "REPLACE_WITH_NEW_SITE_AUTH_KV_ID"

# Required Cloudflare Worker secrets (set in Dashboard; never commit values):
# BOT_TOKEN   - bot token for sending OTP messages
# OTP_PEPPER  - independent random secret used to hash OTP values
